[package]
name = "enderpin"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Reproducible Minecraft client and server workspaces"
license = "GPL-3.0-only"

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "5", default-features = false, features = ["deflate"] }
tempfile = "3"
toml = "0.9"
base64 = "0.22"
ring = "0.17.14"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["AVSpeechSynthesis"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSObject", "NSRunLoop", "NSString"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Com", "Win32_Media_Speech"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"

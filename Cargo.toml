[package]
name = "enderpin"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Reproducible Minecraft client and server workspaces"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "5", default-features = false, features = ["deflate"] }
tempfile = "3"
toml = "0.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"

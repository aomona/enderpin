name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu restricts unprivileged user namespaces. Authorize bwrap only;
          # leave the system-wide restriction and the sandbox enforcement enabled.
          sudo tee /etc/apparmor.d/enderpin-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile enderpin-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/enderpin-bwrap
      - name: Probe native sandbox enforcement
        timeout-minutes: 3
        shell: bash
        run: ENDERPIN_TEST_JAVA_HOME="$JAVA_HOME" cargo test --locked -- --ignored --nocapture

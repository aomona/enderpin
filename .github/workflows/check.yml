name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.2'
      - name: Verify package installation
        shell: bash
        run: |
          cargo build --locked
          binary=target/debug/enderpin
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/package_bun.py "$binary"
          python tests/bun_install.py target/bun/*.tgz
          python scripts/package_npm.py --allow-partial
          python tests/npm_install.py target/npm/*.tgz
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu restricts unprivileged user namespaces. Authorize bwrap only;
          # leave the system-wide restriction and the sandbox enforcement enabled.
          sudo tee /etc/apparmor.d/enderpin-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile enderpin-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/enderpin-bwrap
      - name: Probe native sandbox enforcement
        timeout-minutes: 5
        shell: bash
        run: ENDERPIN_TEST_JAVA_HOME="$JAVA_HOME" cargo test --locked -- --ignored --nocapture

- name: Deploy locked Minecraft workspaces
  hosts: minecraft
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    enderpin_source_root: "{{ playbook_dir }}/../.."
  pre_tasks:
    - name: Validate deployment identity and platform
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - enderpin_root is match('^/[a-zA-Z0-9/_-]+$')
          - enderpin_root not in ['/', '/srv', '/var', '/home', '/usr', '/etc']
          - enderpin_revision is match('^[0-9a-f]{40}$')
          - enderpin_instances | enderpin_instances == enderpin_instances
          - enderpin_backend_interface is match('^[a-zA-Z0-9_-]{1,15}$')
          - enderpin_proxy_address | enderpin_ipv4 == enderpin_proxy_address
          - enderpin_backends | enderpin_backends == enderpin_backends
    - name: Require one persistent forwarding secret
      ansible.builtin.assert:
        that: enderpin_forwarding_secret is match('^[0-9a-f]{64}$')
      no_log: true
    - name: Install host tools
      ansible.builtin.apt:
        name: [acl, bubblewrap, nftables, tar, ca-certificates]
        update_cache: true
        state: present
    - name: Allow bubblewrap user namespaces on Ubuntu with AppArmor
      ansible.builtin.copy:
        dest: /etc/apparmor.d/enderpin-bwrap
        content: |
          abi <abi/4.0>,
          include <tunables/global>
          profile enderpin-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
        mode: '0644'
      when: ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version is version('24.04', '>=')
      register: enderpin_apparmor
    - name: Load bubblewrap AppArmor profile
      ansible.builtin.command:
        argv: [apparmor_parser, -r, /etc/apparmor.d/enderpin-bwrap]
      when: enderpin_apparmor is changed
      changed_when: true
  tasks:
    - name: Resolve every selected workspace before staging
      ansible.builtin.set_fact:
        enderpin_desired: "{{ enderpin_instances | enderpin_deployment(enderpin_source_root, enderpin_backend_interface, enderpin_proxy_address, enderpin_inspector) }}"
        enderpin_staged: []
    - name: Read the previous deployment record
      ansible.builtin.stat:
        path: /etc/enderpin/instances.json
      register: enderpin_record
    - name: Load the previous deployment record
      ansible.builtin.slurp:
        src: /etc/enderpin/instances.json
      register: enderpin_record_content
      when: enderpin_record.stat.exists
    - name: Discover services for safe adoption of older deployments
      ansible.builtin.service_facts:
    - name: Reconcile recorded instances and explicit decommission requests
      ansible.builtin.set_fact:
        enderpin_transition: "{{ enderpin_desired | enderpin_transition((enderpin_record_content.content | b64decode | from_json) if enderpin_record.stat.exists else none, enderpin_decommission | default([]), ansible_facts.services) }}"
    - name: Stage the whole host before changing services or traffic rules
      block:
        - name: Validate and stage every instance
          ansible.builtin.include_tasks: stage.yml
          loop: "{{ enderpin_instances }}"
          loop_control:
            loop_var: instance
            label: "{{ instance.name }}"
        - name: Stop and disable explicitly decommissioned services
          ansible.builtin.include_tasks: decommission.yml
          loop: "{{ enderpin_transition.decommission }}"
          loop_control:
            loop_var: retired
        - name: Create persistent deployment record directory
          ansible.builtin.file:
            path: /etc/enderpin
            state: directory
            mode: '0755'
        - name: Record both old and candidate listeners before cutover
          ansible.builtin.copy:
            content: "{{ enderpin_transition.protected | to_nice_json }}\n"
            dest: /etc/enderpin/instances.json
            mode: '0600'
        - name: Protect both old and candidate backend ports
          ansible.builtin.include_tasks: firewall.yml
          vars:
            enderpin_protected: "{{ enderpin_transition.protected }}"
        - name: Deploy instances one at a time from validated staging
          ansible.builtin.include_tasks: instance.yml
          loop: "{{ enderpin_staged }}"
          loop_control:
            loop_var: prepared
            label: "{{ prepared.instance.name }}"
        - name: Retire obsolete rules only after successful cutover
          ansible.builtin.include_tasks: firewall.yml
          vars:
            enderpin_protected: "{{ enderpin_desired }}"
        - name: Commit the successfully deployed listener inventory
          ansible.builtin.copy:
            content: "{{ enderpin_desired | to_nice_json }}\n"
            dest: /etc/enderpin/instances.json
            mode: '0600'
      always:
        - name: Remove disposable staging files and secret copies
          ansible.builtin.file:
            path: "{{ item.staged.path }}"
            state: absent
          loop: "{{ enderpin_staged }}"
          loop_control:
            label: "{{ item.instance.name }}"

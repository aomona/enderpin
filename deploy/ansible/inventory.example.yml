all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    ansible_user: deploy
    enderpin_root: /srv/enderpin
    # A reviewed binary on the Ansible controller; override per host for ARM64.
    # Native binary for read-only config inspection on the controller (schema v1).
    enderpin_inspector: /opt/enderpin/bin/enderpin
    enderpin_binary: /opt/enderpin/bin/linux-x86_64/enderpin
    enderpin_accept_eula: false # Set true only after reviewing the Minecraft EULA.
    enderpin_proxy_address: 10.77.0.1
    enderpin_backend_interface: epvpn
    enderpin_backends:
      lobby: 10.77.0.2:25566
      survival: 10.77.0.2:25567
    enderpin_try: [lobby]
    enderpin_vpn:
      endpoint: vpn.example.com
      port: 1194
      network: 10.77.0.0/24
      server_address: 10.77.0.1
    enderpin_vpn_clients:
      home: 10.77.0.2
    # Keep this directory on the controller, outside a disposable CI checkout.
    enderpin_pki_directory: /var/lib/enderpin-vpn-pki
  children:
    minecraft:
      hosts:
        home:
          ansible_host: 10.77.0.2
          ansible_ssh_common_args: '-o ProxyJump=deploy@vpn.example.com'
          enderpin_instances:
            - name: lobby
              workspace: .
              target: lobby
              address: 10.77.0.2
              port: 25566
              integration: velocity
            - name: survival
              workspace: .
              target: survival
              address: 10.77.0.2
              port: 25567
              integration: velocity
        edge:
          ansible_host: vpn.example.com
          enderpin_instances:
            - name: proxy
              workspace: .
              target: proxy
              address: 0.0.0.0
              port: 25565
              integration: velocity
    vpn_gateway:
      hosts:
        edge: {}
    vpn_clients:
      hosts:
        home: {}

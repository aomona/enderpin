- name: Select the validated staging workspace
  ansible.builtin.set_fact:
    instance: "{{ prepared.instance }}"
    source: "{{ prepared.source }}"
    staged: "{{ prepared.staged }}"
    instance_root: "{{ enderpin_root }}/{{ prepared.instance.name }}"
    instance_user: "ep_{{ prepared.instance.name }}"
    cutover: false
- name: Deploy staged inputs
  block:
    - name: Install instance service
      ansible.builtin.template:
        src: templates/enderpin.service.j2
        dest: "/etc/systemd/system/enderpin-{{ instance.name }}.service"
        mode: '0644'
    - name: Mark the start of live workspace changes
      ansible.builtin.set_fact:
        cutover: true
    - name: Stop the current server gracefully
      ansible.builtin.systemd_service:
        name: "enderpin-{{ instance.name }}"
        state: stopped
        daemon_reload: true
    - name: Back up the stopped workspace including worlds and local approval state
      ansible.builtin.command:
        argv: [tar, -czf, "{{ instance_root }}/backups/{{ enderpin_revision }}-{{ now(utc=true, fmt='%Y%m%dT%H%M%S%f') }}.tar.gz", -C, "{{ instance_root }}/workspace", .]
      changed_when: true
    - name: Remove obsolete shared inputs after backup
      ansible.builtin.file:
        path: "{{ instance_root }}/workspace/{{ item }}"
        state: absent
      loop: ["{{ source.target }}/files", shared, .enderpinignore]
    - name: Install inputs and binary
      ansible.builtin.copy:
        src: "{{ staged.path }}/{{ item.src }}"
        dest: "{{ instance_root }}/{{ item.dest }}"
        remote_src: true
        owner: "{{ instance_user }}"
        group: "{{ instance_user }}"
        mode: preserve
      loop:
        - {src: enderpin.toml, dest: workspace/enderpin.toml}
        - {src: enderpin.lock, dest: workspace/enderpin.lock}
        - {src: '{{ source.target }}/files/', dest: 'workspace/{{ source.target }}/files/'}
        - {src: 'shared/', dest: 'workspace/shared/'}
        - {src: enderpin, dest: bin/enderpin}
      no_log: true
    - name: Restore managed files from the fixed lock after backup
      become_user: "{{ instance_user }}"
      ansible.builtin.command:
        argv: ["{{ instance_root }}/bin/enderpin", -C, "{{ instance_root }}/workspace", --cache-dir, "{{ instance_root }}/cache", restore, --target, "{{ source.target }}", --offline, --no-ignore]
      changed_when: true
    - name: Verify the installed runtime offline
      become_user: "{{ instance_user }}"
      ansible.builtin.command:
        argv: ["{{ instance_root }}/bin/enderpin", -C, "{{ instance_root }}/workspace", --cache-dir, "{{ instance_root }}/cache", sync, --target, "{{ source.target }}", --locked, --offline]
      changed_when: false
    - name: Inspect the exact installed permission plan
      become_user: "{{ instance_user }}"
      ansible.builtin.command:
        argv: ["{{ instance_root }}/bin/enderpin", -C, "{{ instance_root }}/workspace", --cache-dir, "{{ instance_root }}/cache", permissions, show, --target, "{{ source.target }}", --json]
      register: installed_plan
      changed_when: false
      no_log: true
    - name: Refuse host-local external folder grants in push-authorized deployment
      ansible.builtin.assert:
        that: (installed_plan.stdout | from_json).plan.folders | length == 0
      no_log: true
    - name: Apply permissions authorized by the deployed commit
      become_user: "{{ instance_user }}"
      ansible.builtin.command:
        argv: ["{{ instance_root }}/bin/enderpin", -C, "{{ instance_root }}/workspace", --cache-dir, "{{ instance_root }}/cache", permissions, --target, "{{ source.target }}", --no-interactive, approve, "{{ (installed_plan.stdout | from_json).fingerprint }}"]
      changed_when: true
      no_log: true
    - name: Launch with approval verification and sandbox enforcement
      ansible.builtin.systemd_service:
        name: "enderpin-{{ instance.name }}"
        state: started
        enabled: true
    - name: Wait for the instance TCP listener
      ansible.builtin.wait_for:
        host: "{{ '127.0.0.1' if instance.address == '0.0.0.0' else instance.address }}"
        port: "{{ instance.port }}"
        timeout: 180
    - name: Verify that systemd still considers the instance active
      ansible.builtin.command:
        argv: [systemctl, is-active, "enderpin-{{ instance.name }}"]
      changed_when: false
  rescue:
    - name: Stop after failed deployment without rolling a world backwards
      ansible.builtin.systemd_service:
        name: "enderpin-{{ instance.name }}"
        state: stopped
      when: cutover
    - name: Halt deployment with backup location
      ansible.builtin.fail:
        msg: "Deployment failed. Inspect enderpin-{{ instance.name }} and {{ instance_root }}/backups before restarting or restoring a world."
